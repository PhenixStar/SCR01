name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          for f in scr01 lib/common.sh scripts/*.sh tools/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck (warning severity)
        run: |
          shellcheck --version
          shellcheck -S warning scr01 lib/common.sh scripts/*.sh tools/*.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile-check the Thor driver
        run: python -m py_compile tools/thor-erase.py
